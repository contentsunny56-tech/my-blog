<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Theft Auto V | Download</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    }

    body {
      background: #0b0e14;
      color: #e6edf3;
      padding: 20px 16px 40px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 520px;
      width: 100%;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #58a6ff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    /* Poster Card */
    .game-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #30363d;
      background: #161b22;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      margin-bottom: 20px;
    }

    .game-banner {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(11, 14, 20, 0.95) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px;
    }

    .game-title {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .meta-tags {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* Download Box */
    .action-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #3fb950;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #3fb950;
      border-radius: 50%;
      box-shadow: 0 0 8px #3fb950;
    }

    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(180deg, #2ea043 0%, #238636 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      padding: 14px;
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(35, 134, 54, 0.4);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn-download:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .sub-note {
      font-size: 12px;
      color: #8b949e;
      margin-top: 10px;
    }

    /* System Details */
    .section-header {
      font-size: 14px;
      font-weight: 700;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 20px 0 10px;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .detail-item {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 12px 14px;
    }

    .detail-key {
      font-size: 11px;
      color: #8b949e;
      text-transform: uppercase;
      font-weight: 600;
    }

    .detail-val {
      font-size: 14px;
      font-weight: 600;
      color: #f0f6fc;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-link">← Back to Blog</a>

    <!-- Poster -->
    <div class="game-card">
      <img 
        class="game-banner" 
        src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80" 
        alt="Grand Theft Auto V"
      >
      <div class="banner-overlay">
        <h1 class="game-title">Grand Theft Auto V</h1>
        <div class="meta-tags">
          <span class="tag">PC Repack</span>
          <span class="tag">Open World</span>
          <span class="tag">Action</span>
        </div>
      </div>
    </div>

    <!-- Download Block -->
    <div class="action-card">
      <div class="status-badge">
        <span class="status-dot"></span> Link Verified & Online
      </div>

      <a 
        class="btn-download" 
        href="https://gofile.io/d/joTkiZUx" 
        target="_blank" 
        rel="noopener noreferrer"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Download Game Archive
      </a>

      <p class="sub-note">Hosted externally on GoFile • High speed mirror</p>
    </div>

    <!-- System Requirements Grid -->
    <div class="section-header">Specifications</div>
    <div class="details-grid">
      <div class="detail-item">
        <div class="detail-key">Format</div>
        <div class="detail-val">Compressed Archive</div>
      </div>
      <div class="detail-item">
        <div class="detail-key">Platform</div>
        <div class="detail-val">Windows PC</div>
      </div>
      <div class="detail-item">
        <div class="detail-key">Min RAM</div>
        <div class="detail-val">8 GB Required</div>
      </div>
      <div class="detail-item">
        <div class="detail-key">DirectX</div>
        <div class="detail-val">Version 10 / 11</div>
      </div>
    </div>
  </div>

</body>
</html>
